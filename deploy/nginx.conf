# AI 实战训练场管理端 · Nginx 站点配置（生产期）
#
# 依据：复刻平台前端/AI助手WS接入说明.md §2.3
#
# 要点：网关（Spring Cloud Gateway Server WebMVC，servlet 版）不支持 WebSocket upgrade
# （其 RemoveHopByHopRequestHeadersFilter 会剥掉 Connection/Upgrade 逐跳头），
# 因此 WS 由 Nginx 直接透传到后端 8082，其余 HTTP 走网关 8080。
#
# 部署前替换：your-host / <前端主机路径> / <后端主机> / <网关主机>
# 前端构建产物：npm run build → dist/

server {
    listen 80;
    server_name your-host;

    # 前端静态资源（hash 路由，未命中的路径回退 index.html）
    location / {
        root /usr/share/nginx/html;   # 前端 dist
        try_files $uri $uri/ /index.html;
    }

    # WS：透传 upgrade 到后端 8082（网关不支持 WS，故不经网关）
    location /api/act/ws/ {
        proxy_pass http://<后端主机>:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;      # 长连接：别让 Nginx 60s 默认超时把对话掐断
        proxy_send_timeout 3600s;
    }

    # 其余 HTTP：走网关 8080
    location /api/ {
        proxy_pass http://<网关主机>:8080;
        proxy_set_header Host $host;
    }

    # 材料上传（≥2MB pptx）：放宽请求体上限，与后端 50MB 上限对齐
    client_max_body_size 50m;
}